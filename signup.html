<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | Lumière Dining</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚜</text></svg>">
    <style>
        .error-message {
            color: #ff6b6b;
            font-size: 0.8rem;
            margin-top: 5px;
            display: none;
        }

        .form-control.error {
            border-color: #ff6b6b;
        }
    </style>
</head>

<body data-theme="dark"
    style="display: flex; flex-direction: column; min-height: 100vh; background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url('https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?auto=format&fit=crop&w=1920&q=80') no-repeat center center/cover; background-attachment: fixed;">

    <div style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 20px;">
        <div class="pop-up"
            style="background: var(--card-bg); padding: 40px; border-radius: 15px; box-shadow: var(--shadow); width: 100%; max-width: 420px; text-align: center;">
            <a href="index.html" class="logo" style="justify-content: center; margin-bottom: 30px; cursor: pointer;">
                <span style="font-size: 2.5rem;">⚜</span> Lumière
            </a>
            <h2 style="margin-bottom: 20px;">Create Account</h2>
            <p style="opacity: 0.7; margin-bottom: 30px;">Join us for exclusive offers and events.</p>

            <form id="signupForm" novalidate>
                <div class="form-group" style="text-align: left;">
                    <label>Full Name</label>
                    <input type="text" id="name" class="form-control" placeholder="John Doe" required>
                    <span class="error-message">Name is required.</span>
                </div>
                <div class="form-group" style="text-align: left;">
                    <label>Email Address</label>
                    <input type="email" id="email" class="form-control" placeholder="john@example.com" required>
                    <span class="error-message">Valid email is required.</span>
                </div>
                <div class="form-group" style="text-align: left;">
                    <label>Password</label>
                    <input type="password" id="password" class="form-control" placeholder="Create a password" required>
                    <span class="error-message">Password is required (min 6 chars).</span>
                </div>
                <button type="submit" class="btn" style="width: 100%;">Create Account</button>
            </form>

            <div class="divider"><span>OR</span></div>

            <button class="social-btn">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path
                        d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
                        fill="#4285F4" />
                    <path
                        d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
                        fill="#34A853" />
                    <path
                        d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"
                        fill="#FBBC05" />
                    <path
                        d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
                        fill="#EA4335" />
                </svg>
                Sign up with Google
            </button>
            <button class="social-btn">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="#1877F2">
                    <path
                        d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z" />
                </svg>
                Sign up with Facebook
            </button>

            <p style="text-align: center; margin-top: 20px; font-size: 0.9rem;">
                Already have an account? <a href="login.html" style="color: var(--primary-color);">Login</a>
            </p>

            <a href="index.html" class="back-home">← Back to Home</a>
        </div>
    </div>

    <script src="js/main.js"></script>
    <script>
        document.getElementById('signupForm').addEventListener('submit', function (e) {
            e.preventDefault();
            let isValid = true;

            const inputs = this.querySelectorAll('input');
            inputs.forEach(input => {
                const errorSpan = input.nextElementSibling;
                if (!input.value) {
                    input.classList.add('error');
                    if (errorSpan) errorSpan.style.display = 'block';
                    isValid = false;
                } else {
                    input.classList.remove('error');
                    if (errorSpan) errorSpan.style.display = 'none';
                }
            });

            // Email check
            const email = document.getElementById('email');
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (email.value && !emailRegex.test(email.value)) {
                email.classList.add('error');
                email.nextElementSibling.innerText = "Please enter a valid email.";
                email.nextElementSibling.style.display = 'block';
                isValid = false;
            }

            // Password length check
            const password = document.getElementById('password');
            if (password.value && password.value.length < 6) {
                password.classList.add('error');
                password.nextElementSibling.innerText = "Password must be at least 6 characters.";
                password.nextElementSibling.style.display = 'block';
                isValid = false;
            }

            if (isValid) {
                alert('Account Created Successfully! Redirecting to Login...');
                window.location.href = 'login.html';
            }
        });
    </script>
</body>

</html>
